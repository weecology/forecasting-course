project:
  type: website
  output-dir: _site
  # Regenerates schedule/_schedule_table.md from schedule.csv before every
  # render, so the published schedule can never drift from the CSV. A bad
  # lesson title exits nonzero here and aborts the render.
  pre-render: scripts/build_schedule.R
  render:
    - index.qmd
    - about/*.qmd
    - Contributing/*.qmd
    - getting-started/*.qmd
    - lessons/*.qmd
    - lessons/*/*.qmd
    - schedule/*.qmd
    - syllabus/*.qmd
    # Raw R scratch files with no front matter; kept in the repo, not published.
    - "!lessons/R-state-space-models-1/r_tutorial_new.qmd"
    - "!lessons/R-state-space-models-1/r_tutorial_new_notes.qmd"
  resources:
    - data/**
    - media/**
    - "**/*.pdf"
    - "**/*.R"
    # Netlify redirects from the old Hugo URLs; must ship inside _site.
    - _redirects

# Currently R code in the tutorials is displayed but not run.
#
# Quarto still selects the knitr engine for any file containing ```{r} chunks
# and needs knitr + rmarkdown installed to process them, even with execution
# disabled. CI installs those two packages; see .github/workflows/publish.yml.
#
# To instead run the code, set `enabled: true` (plus `freeze: auto`) and
# install the necessary packages for the tutorials in CI.
execute:
  enabled: false

